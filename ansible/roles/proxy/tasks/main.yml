---
- name: Install proxy host packages
  apt:
    name:
      - nftables
    state: present
    update_cache: true

- name: Ensure proxy config directory exists
  file:
    path: /etc/mcproxy
    state: directory
    mode: "0755"

- name: Ensure nftables include directory exists
  file:
    path: /etc/nftables.d
    state: directory
    mode: "0755"

- name: Advertise Tailscale subnet on proxy host
  command:
    argv:
      - tailscale
      - up
      - --advertise-routes={{ proxy_tailscale_subnet }}
  register: proxy_tailscale_up
  changed_when: "'Success.' in proxy_tailscale_up.stdout or 'Success.' in proxy_tailscale_up.stderr"

- name: Render proxy config
  template:
    src: config.json.j2
    dest: /etc/mcproxy/config.json
    mode: "0600"
  notify: Restart proxy

- name: Install proxy nftables base config
  copy:
    src: "{{ playbook_dir }}/../../deploy/nftables-proxy.conf"
    dest: /etc/nftables.d/mcproxy-proxy.conf
    mode: "0644"
  notify:
    - Reload nftables
    - Restart proxy

- name: Install proxy filter config
  copy:
    src: "{{ playbook_dir }}/../../deploy/nftables-filter.conf"
    dest: /etc/nftables.d/mcproxy-filter.conf
    mode: "0644"
  notify:
    - Reload nftables
    - Restart proxy

- name: Render proxy tproxy config
  template:
    src: nftables-tproxy.conf.j2
    dest: /etc/nftables.d/mcproxy-tproxy.conf
    mode: "0644"
  notify:
    - Reload nftables
    - Restart proxy

- name: Install proxy sysctl config
  copy:
    src: "{{ playbook_dir }}/../../deploy/sysctl.conf"
    dest: /etc/sysctl.d/99-mcproxy.conf
    mode: "0644"
  notify: Reload sysctl

- name: Ensure nftables main config exists
  copy:
    dest: /etc/nftables.conf
    content: |
      flush ruleset
    force: false
    mode: "0644"

- name: Ensure nftables main config includes managed mcproxy rules
  blockinfile:
    path: /etc/nftables.conf
    create: true
    marker: "# {mark} ANSIBLE MANAGED MCPROXY RULES"
    block: |
      include "/etc/nftables.d/mcproxy-proxy.conf"
      include "/etc/nftables.d/mcproxy-filter.conf"
      include "/etc/nftables.d/mcproxy-tproxy.conf"
  notify:
    - Reload nftables
    - Restart proxy

- name: Install TPROXY policy routing unit
  template:
    src: mcproxy-tproxy-routing.service.j2
    dest: /etc/systemd/system/mcproxy-tproxy-routing.service
    mode: "0644"
  notify:
    - Reload systemd
    - Restart tproxy routing
    - Restart proxy

- name: Enable and start nftables
  systemd:
    name: nftables
    enabled: true
    state: started

- name: Enable and start TPROXY policy routing
  systemd:
    name: mcproxy-tproxy-routing.service
    enabled: true
    state: started

- name: Start proxy compose profile
  command: docker compose --profile proxy up -d --build
  args:
    chdir: "{{ mcproxy_deploy_dir }}"
