# Shared across all roles

# Redis connection — all services point here
redis_tailscale_ip: "100.64.0.22" # Tailscale IP of the Redis machine
redis_port: 6379
redis_addr: "{{ redis_tailscale_ip }}:{{ redis_port }}"
redis_password: "changeme" # override in ansible-vault

# Repo to deploy from
mcproxy_repo: "https://github.com/siderocloud/sidero-proxy"
mcproxy_deploy_dir: /opt/mcproxy

# mcproxy config defaults (can be overridden per host)
tproxy_port: 8080
ip_ttl_seconds: 604800

# Game nodes — list of all backend nodes.
# All proxies forward to all nodes; all node public IPs are intercepted by TPROXY.
nodes:
  - name: node-1
    public_ip: "167.235.15.102"
    tailscale_ip: "100.64.0.18"
  # - name: node-2
  #   public_ip: "1.2.3.5"
  #   tailscale_ip: "100.64.0.18"

# Tailscale auth key — generate at https://login.tailscale.com/admin/settings/keys
# Use a reusable, ephemeral key. Store in vault.
tailscale_auth_key: "tskey-auth-CHANGEME"
